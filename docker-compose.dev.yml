# =============================================================================
# artaround — Ambiente di SVILUPPO (orchestrazione dei 3 submodule)
# -----------------------------------------------------------------------------
# 4 servizi, ciascuno buildato dal proprio Dockerfile DI SVILUPPO già presente
# nel rispettivo submodule (nessuna duplicazione qui): mongo, backend,
# marketplace, navigator, tutti sulla stessa rete Docker di questo compose.
#
# Prerequisito: submodule inizializzati
#   git submodule update --init --recursive
#
# Nessun file .env da preparare: ogni variabile ha già un default di sviluppo
# scritto qui sotto (${VAR:-default}). Avvio:
#   1) docker compose -f docker-compose.dev.yml up -d --build mongo backend
#   2) docker compose -f docker-compose.dev.yml run --rm backend npm run seed
#      -> stampa la API key di bootstrap
#   3) API_KEY=<chiave-stampata> docker compose -f docker-compose.dev.yml up -d --build
#      (oppure: export API_KEY=... nella shell prima del comando)
#
# URL:
#   Backend/Swagger : http://localhost:3002/docs
#   Navigator       : http://localhost:5173
#   Marketplace     : http://localhost:5174
# =============================================================================

name: artaround

services:
  mongo:
    image: mongo:7
    container_name: artaround-mongo-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-artaround}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-artaround}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-artaround}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet
          -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD
          --authenticationDatabase admin localhost:27017/admin
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Riusa il Dockerfile DI SVILUPPO del submodule backend: zero duplicazione.
  backend:
    build:
      context: ./services/backend
      dockerfile: docker/Dockerfile
    image: artaround-backend:dev
    container_name: artaround-backend-dev
    environment:
      NODE_ENV: development
      PORT: "3001"
      NODE_OPTIONS: --inspect=0.0.0.0:9229
      CHOKIDAR_USEPOLLING: "true"
      MONGO_URI: mongodb://${MONGO_USER:-artaround}:${MONGO_PASSWORD:-artaround}@mongo:27017/${MONGO_DB:-artaround}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SWAGGER_USER: ${SWAGGER_USER:-swagger}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-swagger}
    ports:
      - "3002:3001"   # host 3002 (evita conflitto con Docker Desktop su :3001) -> container 3001
      - "9229:9229"   # debugger Node
    volumes:
      - ./services/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Riusa il Dockerfile DI SVILUPPO del submodule marketplace: zero duplicazione.
  marketplace:
    build:
      context: ./services/marketplace
      dockerfile: docker/Dockerfile
    image: artaround-marketplace:dev
    container_name: artaround-marketplace-dev
    environment:
      # serve.js gira DENTRO il container: raggiunge il backend via rete Docker
      # (nome del servizio "backend"), non via localhost.
      BACKEND_URL: ${MARKETPLACE_BACKEND_URL:-http://backend:3001}
      API_KEY: ${API_KEY:-}
    ports:
      - "5174:5174"
    volumes:
      - ./services/marketplace:/app
    depends_on:
      - backend
    restart: unless-stopped

  # Riusa il Dockerfile DI SVILUPPO del submodule navigator: zero duplicazione.
  navigator:
    build:
      context: ./services/navigator
      dockerfile: docker/Dockerfile
    image: artaround-navigator:dev
    container_name: artaround-navigator-dev
    environment:
      # ATTENZIONE: qui il fetch lo fa il BROWSER sull'host, non il container:
      # deve restare un URL raggiungibile dall'host (porta pubblicata), MAI il
      # nome del servizio Docker "backend" (il browser non lo risolverebbe).
      BACKEND_URL: ${NAVIGATOR_BACKEND_URL:-http://localhost:3002}
      API_KEY: ${API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./services/navigator:/app
      - navigator_node_modules:/app/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  backend_node_modules:
  navigator_node_modules:
